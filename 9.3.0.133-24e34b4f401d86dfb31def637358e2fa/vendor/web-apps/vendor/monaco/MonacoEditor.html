<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' 'unsafe-hashes' 'sha256-/Ek8nYVvOE2ur8JTiP0s28lJ9qfmz5GQIoq7+jGcdbs='; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' data: blob:; media-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'">
    <title>CODE EDITOR</title>
    <style type="text/css">
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
        }
        #editor {
            height: 100%;
            width: 100%;
        }
    </style>
    <script src="./monaco.js"></script>
</head>
<body>
    <div id="editor"></div>

    <!-- code -->
    <script>
        function getUrlParams() {
            var e,
                    a = /\+/g,  // Regex for replacing addition symbol with a space
                    r = /([^&=]+)=?([^&]*)/g,
                    d = function (s) { return decodeURIComponent(s.replace(a, " ")); },
                    q = window.location.search.substring(1),
                    urlParams = {};

            while (e = r.exec(q))
                urlParams[d(e[1])] = d(e[2]);

            return urlParams;
        }

        var params = getUrlParams();
        window.editorType = params["editorType"]; // word/cell/slide
        window.editorTheme = params["editorTheme"]; // dark/light
        window.language = params["language"]; //javascript/vba
        window.id = params["id"];
    </script>
    <script src="./MonacoEditorCode.js"></script>
</body>
</html>
